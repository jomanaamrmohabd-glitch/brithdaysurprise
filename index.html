<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pixel Cake 🎂</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik+Bubbles&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #0b0f2f;
    font-family: 'Rubik Bubbles', cursive;
    color: white;
}

/* نجوم */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    opacity: 0.6;
}

/* blur */
.blur {
    position: absolute;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(3px);
}

/* center */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    text-align: center;
}

/* نص */
.bigText {
    font-size: 28px;
    margin-bottom: 20px;
}

/* button */
button {
    padding: 12px 25px;
    border-radius: 12px;
    border: none;
    background: #ffcc00;
    cursor: pointer;
    font-family: 'Rubik Bubbles';
}

/* cake */
.cake {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.layer {
    height: 35px;
    border-radius: 50px;
    margin: 5px;
    opacity: 0;
    transform: translateY(-40px);
}

.l1 { width: 120px; background: #ff4d4d; }
.l2 { width: 160px; background: #ff9933; }
.l3 { width: 200px; background: #ffee33; }
.l4 { width: 240px; background: #33cc66; }

.show {
    animation: drop 0.5s forwards;
}

@keyframes drop {
    to { opacity:1; transform:translateY(0); }
}

/* candle */
.candle {
    width: 12px;
    height: 40px;
    background: pink;
    position: relative;
}

.wick {
    width: 3px;
    height: 8px;
    background: white;
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
}

.flame {
    width: 10px;
    height: 12px;
    background: orange;
    border-radius: 50%;
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    animation: flicker 0.2s infinite;
}

@keyframes flicker {
    0% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.3); }
    100% { transform: translateX(-50%) scale(1); }
}

/* table */
.table {
    width: 300px;
    height: 20px;
    background: white;
    margin-top: 10px;
}

/* lighter */
.lighter {
    width: 30px;
    height: 60px;
    background: black;
    position: absolute;
    bottom: 30px;
    left: 30px;
    border-radius: 6px;
}

/* سهم */
.arrow {
    position: absolute;
    bottom: 100px;
    left: 30px;
    font-size: 30px;
}

/* countdown */
.count {
    font-size: 60px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="blur"></div>
<div id="app"></div>
<audio id="fireSound" src="fire.mp3"></audio>

<script>

let app=document.getElementById("app");

/* stars */
for(let i=0;i<80;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*100+"vw";
 s.style.top=Math.random()*100+"vh";
 document.body.appendChild(s);
}

/* page1 */
function page1(){
 app.innerHTML=`
 <div class="center">
   <div class="bigText">wants to see your birthday cake?</div>
   <button onclick="page2()">Continue</button>
 </div>`;
}

/* page2 */
function page2(){
 app.innerHTML=`
 <div class="center">

   <div class="bigText" id="topText">Drag the lighter to light the candle</div>
   <div id="count" class="count"></div>

   <div class="cake">
     <div class="candle">
       <div class="wick"></div>
       <div id="flame" class="flame"></div>
     </div>
     <div id="cake"></div>
     <div class="table"></div>
   </div>

 </div>

 <div class="arrow">⬇️</div>
 <div class="lighter" id="lighter"></div>
 `;

 buildCake();
 drag();
}

/* build cake */
function buildCake(){
 let cake=document.getElementById("cake");
 ["l1","l2","l3","l4"].forEach((c,i)=>{
  setTimeout(()=>{
   let d=document.createElement("div");
   d.className="layer "+c;
   cake.prepend(d);
   d.classList.add("show");
  },i*600);
 });
}

/* drag */
function drag(){
 let lighter=document.getElementById("lighter");
 let flame=document.getElementById("flame");
 let drag=false,lit=false;

 lighter.onpointerdown=()=>drag=true;
 document.onpointerup=()=>drag=false;

 document.onpointermove=e=>{
  if(!drag||lit) return;

  lighter.style.left=e.clientX+"px";
  lighter.style.top=e.clientY+"px";

  let c=document.querySelector(".candle").getBoundingClientRect();

  if(e.clientX>c.left&&e.clientX<c.right&&e.clientY>c.top&&e.clientY<c.bottom){
    lit=true;
    flame.style.display="block";
    document.getElementById("fireSound").play();
    countdown();
  }
 }
}

/* countdown */
function countdown(){
 document.getElementById("topText").innerText="blow the candle after counting to ten";

 let c=10;
 let div=document.getElementById("count");

 let i=setInterval(()=>{
   div.innerText=c;
   c--;
   if(c<0){
     clearInterval(i);
     end();
   }
 },1000);
}

/* end */
function end(){
 document.getElementById("flame").style.display="none";

 app.innerHTML=`
 <div class="center">
   <div class="bigText">HAPPY BIRTHDAY OUR NOUR 🎉</div>
 </div>`;
}

page1();

</script>

</body>
</html>
